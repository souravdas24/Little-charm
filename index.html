<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Charm Online Shop</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
}

header {
    background: #172554;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 32px;
}

header p {
    margin-top: 8px;
}

nav {
    background: #2563eb;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 12px;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #172554;
}

.categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.category {
    background: white;
    padding: 30px 15px;
    text-align: center;
    border-radius: 12px;
    text-decoration: none;
    color: #172554;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.category:hover {
    transform: translateY(-6px);
    background: #dbeafe;
}

.category .emoji {
    font-size: 45px;
    margin-bottom: 15px;
}

.category h3 {
    font-size: 18px;
}

footer {
    background: #172554;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}
</style>
</head>

    <h1>SD24 Online Shop</h1>

</header>

<nav>

    <a href="#categories">Categories</a>
    <a href="#contact">Contact</a>
</nav>

<div class="container" id="categories">

    <h2>Shop By Category</h2>

    <div class="categories">

        <a href="#fashion" class="category">
            <div class="emoji">👗</div>
            <h3>Fashion</h3>
        </a>

        <a href="#sports" class="category">
            <div class="emoji">⚽</div>
            <h3>Sports</h3>
        </a>

        <a href="#gifts" class="category">

        </a>

        <a href="#beauty" class="category">

        </a>

        <a href="#others" class="category">
            <div class="emoji">🛍️</div>
            <h3>Other Products</h3>
        </a>

        <a href="#electronics" class="category">
            <div class="emoji">📱</div>
            <h3>Electronics</h3>
        </a>

    </div>
</div>

<footer id="contact">
